<header class="flex h-20 items-center justify-between border-b border-slate-200 bg-white px-8">
    <!-- Título -->
    <div>
        <h1 class="text-2xl font-bold text-slate-800">
            Resumen
        </h1>

        <p class="text-sm text-slate-500">
            Bienvenido de nuevo
        </p>
    </div>

    <!-- Acciones -->
    <div class="flex items-center gap-4">

        <!-- Fecha y hora -->
        <div class="hidden items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 lg:flex">
            <svg lucideClock3 class="h-4 w-4 text-indigo-600"></svg>

            <div>
                <p class="text-xs text-slate-500">
                    {{ currentDate() }}
                </p>

                <p class="text-sm font-semibold text-slate-700">
                    {{ currentTime() }}
                </p>
            </div>
        </div>

        <!-- Buscar -->
        <div class="relative hidden md:block">

            <svg lucideSearch class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400">
            </svg>

            <input type="text" placeholder="Buscar..."
                class="w-64 rounded-xl border border-slate-200 bg-slate-50 py-2 pl-10 pr-4 text-sm outline-none transition focus:border-indigo-500 focus:bg-white" />
        </div>

        <!-- Notificaciones -->
        <button class="relative flex h-10 w-10 items-center justify-center rounded-xl transition hover:bg-slate-100">
            <svg lucideBell class="h-5 w-5 text-slate-600"></svg>

            <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-red-500"></span>
        </button>

        <!-- Tema -->
        <button class="flex h-10 w-10 items-center justify-center rounded-xl transition hover:bg-slate-100">
            <svg lucideMoon class="h-5 w-5 text-slate-600"></svg>
        </button>

        <!-- Usuario -->
        <div class="flex items-center gap-3 rounded-xl border border-slate-200 px-3 py-2">
            <div
                class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-100 font-semibold text-indigo-600">
                JP
            </div>

            <div class="hidden sm:block">
                <p class="text-sm font-semibold text-slate-800">
                    Juan Díaz
                </p>

                <p class="text-xs text-slate-500">
                    Administrador
                </p>
            </div>
        </div>

    </div>
</header>
